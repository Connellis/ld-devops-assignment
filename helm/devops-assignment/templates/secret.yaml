{{- $root := . }}
{{- range $i, $ns := list "server" "client" }}
{{- if $i }}---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: server-auth
  namespace: {{ $root.Values.global.namespacePrefix }}{{ $ns }}
  labels:
    {{- include "devops-assignment.labels" $root | nindent 4 }}
type: Opaque
stringData:
  # The same value is needed on both sides: the server validates it, the
  # client sends it. In a real system this would come from Vault/ESO rather
  # than being duplicated, but for the demo it's injected at install time.
  SHARED_SECRET: {{ required "a shared secret is required" $root.Values.global.sharedSecret }}
{{- end }}