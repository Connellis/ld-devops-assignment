{{- $root := . }}
{{- range $app := list "server" "client" }}
{{- $cfg := index $root.Values $app }}
{{- $ns := printf "%s%s" $root.Values.global.namespacePrefix $cfg.namespace }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ $cfg.name }}-quota
  namespace: {{ $ns }}
  labels:
    {{- include "devops-assignment.labels" $root | nindent 4 }}
spec:
  hard:
    "requests.cpu": {{ $cfg.resourceQuota.requests.cpu | quote }}
    "requests.memory": {{ $cfg.resourceQuota.requests.memory | quote }}
    "limits.cpu": {{ $cfg.resourceQuota.limits.cpu | quote }}
    "limits.memory": {{ $cfg.resourceQuota.limits.memory | quote }}
    pods: {{ $cfg.resourceQuota.pods | quote }}
---
{{- end }}
