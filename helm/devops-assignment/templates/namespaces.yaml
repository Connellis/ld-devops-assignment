{{- $root := . }}
{{- range $ns := list "server" "client" }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $root.Values.global.namespacePrefix }}{{ $ns }}
  labels:
    {{- include "devops-assignment.labels" $root | nindent 4 }}
    {{- include "devops-assignment.partOf" $root | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
{{- end }}