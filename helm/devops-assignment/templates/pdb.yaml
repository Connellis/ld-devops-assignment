{{- $root := . }}
{{- $serverCfg := .Values.server }}
{{- $serverNs := printf "%s%s" $root.Values.global.namespacePrefix $serverCfg.namespace }}
{{- if $serverCfg.pdb }}
# With two replicas, keep at least one available during voluntary disruptions.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $serverCfg.name }}-pdb
  namespace: {{ $serverNs }}
  labels:
    {{- include "devops-assignment.labels" $root | nindent 4 }}
spec:
  minAvailable: {{ $serverCfg.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $serverCfg.name }}
{{- end }}