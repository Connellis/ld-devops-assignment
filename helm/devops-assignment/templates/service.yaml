{{- $root := . }}
{{- range $app := list "server" "client" }}
{{- $cfg := index $root.Values $app }}
{{- $ns := printf "%s%s" $root.Values.global.namespacePrefix $cfg.namespace }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $cfg.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "devops-assignment.labels" $root | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $cfg.name }}
  ports:
    - name: http
      port: {{ $cfg.service.port }}
      targetPort: http
---
{{- end }}