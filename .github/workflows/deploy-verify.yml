name: Deploy & Verify

on:
  push:
    branches: [main]

env:
  IMAGE_BASE: ghcr.io/connellis/ld-devops-assignment

jobs:
  deploy-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up kind
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: devops-assignment
          config: kind-config.yaml

      - name: Install Calico (NetworkPolicy enforcement)
        run: |
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/calico.yaml
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=180s
          kubectl -n kube-system rollout status deployment/calico-kube-controllers --timeout=180s
          kubectl wait --for=condition=Ready nodes --all --timeout=180s

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.15.4

      - name: Create application namespaces
        run: |
          for namespace in server client; do
            kubectl create namespace "$namespace" --dry-run=client -o yaml | kubectl apply -f -
            kubectl label namespace "$namespace" app.kubernetes.io/managed-by=Helm --overwrite
            kubectl annotate namespace "$namespace" \
              meta.helm.sh/release-name=devops-assignment \
              meta.helm.sh/release-namespace=default --overwrite
          done

      - name: Create GHCR pull secret
        run: |
          for namespace in server client; do
            kubectl -n "$namespace" create secret docker-registry ghcr-pull \
              --docker-server=ghcr.io \
              --docker-username="${{ github.actor }}" \
              --docker-password="${{ secrets.GITHUB_TOKEN }}" \
              --dry-run=client -o yaml | kubectl apply -f -
          done

      - name: Deploy with Helm
        run: |
          helm upgrade --install devops-assignment helm/devops-assignment \
            --namespace default --create-namespace \
            --set global.sharedSecret="${{ secrets.SHARED_SECRET }}" \
            --set server.image.repository="${{ env.IMAGE_BASE }}/server" \
            --set server.image.tag=main \
            --set client.image.repository="${{ env.IMAGE_BASE }}/client" \
            --set client.image.tag=main \
            --set global.imagePullSecrets[0].name=ghcr-pull \
            --wait --timeout 180s

      - name: Smoke test
        run: ./scripts/smoke-test.sh